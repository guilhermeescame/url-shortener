apiVersion: v1
kind: Service
metadata:
  name: {{ include "url-shortener.componentName" (dict "root" $ "component" "redis") }}
  labels:
    {{- include "url-shortener.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  {{/* Headless: a single replica has nothing to balance, so DNS resolves
  straight to the pod */}}
  clusterIP: None
  selector:
    {{- include "url-shortener.selectorLabels" (dict "root" $ "component" "redis") | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
