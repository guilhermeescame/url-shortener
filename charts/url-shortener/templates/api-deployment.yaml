apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "url-shortener.componentName" (dict "root" $ "component" "api") }}
  labels:
    {{- include "url-shortener.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "url-shortener.selectorLabels" (dict "root" $ "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "url-shortener.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        {{/* Rolls the pods whenever the ConfigMap changes, so a LOG_LEVEL edit
        takes effect on upgrade without a manual restart */}}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "url-shortener.componentName" (dict "root" $ "component" "api") }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          {{/* Liveness stays independent of Redis: a downstream outage should
          not restart the API, only pull it out of rotation via readiness */}}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
