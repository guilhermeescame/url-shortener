apiVersion: v1
kind: Service
metadata:
  name: {{ include "url-shortener.componentName" (dict "root" $ "component" "frontend") }}
  labels:
    {{- include "url-shortener.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  selector:
    {{- include "url-shortener.selectorLabels" (dict "root" $ "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
