apiVersion: v1
kind: Service
metadata:
  name: {{ include "url-shortener.componentName" (dict "root" $ "component" "api") }}
  labels:
    {{- include "url-shortener.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "url-shortener.selectorLabels" (dict "root" $ "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
