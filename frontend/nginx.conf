server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Same-origin proxy to the API, avoiding CORS in the frontend
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location /r/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
}
